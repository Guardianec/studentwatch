services:
  - type: web
    name: postup-pilot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    envVars:
      - key: POSTUP_MODE
        value: production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: POSTUP_DATABASE_URL
        sync: false
